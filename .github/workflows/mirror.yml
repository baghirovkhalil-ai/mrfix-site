name: Köhnə saytdan faylları köçür

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/**", "tools/mirror_assets.py", ".github/workflows/mirror.yml"]

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/mirror_assets.py
      - name: Yeni faylları repoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add static/m
          git diff --cached --quiet || (git commit -m "mrfix.az şəkil və PDF-ləri yerli nüsxəyə köçürüldü" && git push)
