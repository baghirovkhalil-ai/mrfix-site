name: Panel kodunu götür (müvəqqəti)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/panel-fetch.yml"]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir panel && cd panel
          curl -sSfL https://mrfixdigital.netlify.app/ -o index.html
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: panel
          path: panel
          retention-days: 1
