name: Köhnə saytdan məhsulları gətir

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/import_old_products.py", ".github/workflows/import.yml"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 markdown
      - run: python tools/import_old_products.py
      - run: python tools/mirror_assets.py
      - run: python build.py
      - name: Dəyişiklikləri repoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add content static/m _site
          git diff --cached --quiet || (git commit -m "Köhnə saytdakı çatışmayan məhsullar əlavə olundu" && git push)
